name: Verify source

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify source
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r tools/mpkg/requirements.txt
          npm run check
          python -m py_compile tools/mpkg/mobile_mpkg.py
          python -m unittest tools/mpkg/test_mobile_mpkg.py
