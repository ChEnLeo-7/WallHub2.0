name: Windows package

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Windows x64 packages
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Verify source
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
          npm run build:ui
          python -m py_compile tools/mpkg/mobile_mpkg.py tools/mpkg/wallpaper_engine_toolkit.py

      - name: Build portable and installer packages
        shell: pwsh
        run: npm run build:windows:installer

      - name: Smoke test packaged application
        shell: pwsh
        run: .\build\windows-x64\WallHub\WallHub.exe --smoke-test

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: WallHub-windows-x64
          if-no-files-found: error
          path: |
            dist/WallHub-Portable-win-x64.zip
            dist/WallHub-Portable-win-x64.zip.sha256
            dist/WallHub-Setup-win-x64.exe
            dist/WallHub-Setup-win-x64.exe.sha256
