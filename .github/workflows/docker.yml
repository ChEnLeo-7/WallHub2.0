name: Build latest Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build and publish latest container
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chenleo-7/wallhub
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and publish amd64 and arm64 images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            WALLHUB_VERSION=latest
            WALLHUB_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published image digest
        shell: bash
        run: |
          echo "Image: ghcr.io/chenleo-7/wallhub:latest"
          echo "Source: $GITHUB_SHA"
          echo "Digest: ${{ steps.build.outputs.digest }}"
