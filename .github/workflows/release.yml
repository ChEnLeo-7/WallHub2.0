name: Release Windows packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v2.0.1
        required: true
        type: string
      prerelease:
        description: Mark this GitHub release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Verify and build release packages
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
          npm run build:windows:installer
          .\build\windows-x64\WallHub\WallHub.exe --smoke-test

      - name: Create release notes
        id: notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $previousTag = git tag --sort=-version:refname | Where-Object { $_ -ne $env:RELEASE_TAG } | Select-Object -First 1
          $notes = @("## WallHub $env:RELEASE_TAG", "", "### 本次更新")
          if ($previousTag) {
            $changes = git log --pretty=format:'- %s (%h)' "$previousTag..$env:RELEASE_TAG"
            if ($changes) {
              $notes += $changes
            }
            else {
              $notes += '- 没有检测到相对上一版本的提交。'
            }
            $notes += ""
            $notes += "完整比较：https://github.com/${{ github.repository }}/compare/$previousTag...$env:RELEASE_TAG"
          }
          else {
            $notes += '- WallHub 2.0 首个正式 Windows 版本。'
            $notes += '- 浏览、搜索和筛选 Wallpaper Engine 创意工坊内容，支持关键词、项目 ID、作者 ID 与精确短语。'
            $notes += '- 提供下载队列、真实进度、暂停/继续、优先级调整，以及视频壁纸本地播放与实验性分块在线播放。'
            $notes += '- 支持 Steam 账号密码、Steam Guard 与二维码登录；默认安全模式可按需开启成人内容选项。'
            $notes += '- 场景壁纸可转换为移动端 MPKG，并保留音频文件；提供快速与压缩两种转换方式。'
            $notes += '- 提供免依赖 Windows 安装版与便携版，内置 Node.js、Python、.NET 和运行所需组件。'
            $notes += '- 后续版本会在此处自动列出新增功能、优化和 `fix` 修复提交。'
          }
          $notes += ""
          $notes += '### 下载说明'
          $notes += '- `WallHub-Setup-win-x64.exe`：Windows 图形安装版。'
          $notes += '- `WallHub-Portable-win-x64.zip`：Windows 免安装便携版，解压后运行 `WallHub.exe`。'
          $notes += '- 另附 SHA-256 校验文件；GitHub 自动提供本标签对应的 Source code (zip) 和 Source code (tar.gz)。'
          $notes -join "`n" | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          body_path: release-notes.md
          files: |
            dist/WallHub-Portable-win-x64.zip
            dist/WallHub-Portable-win-x64.zip.sha256
            dist/WallHub-Setup-win-x64.exe
            dist/WallHub-Setup-win-x64.exe.sha256
