name: Release Windows packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v2.0.1
        required: true
        type: string
      prerelease:
        description: Mark this GitHub release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Verify and build release packages
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
          npm run build:windows:installer
          .\build\windows-x64\WallHub\WallHub.exe --smoke-test

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            dist/WallHub-Portable-win-x64.zip
            dist/WallHub-Portable-win-x64.zip.sha256
            dist/WallHub-Setup-win-x64.exe
            dist/WallHub-Setup-win-x64.exe.sha256
