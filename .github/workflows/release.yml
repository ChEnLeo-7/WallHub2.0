name: Release WallHub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v2.0.1
        required: true
        type: string
      prerelease:
        description: Mark this GitHub release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    name: Build and validate release assets
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Verify and build release packages
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r tools/mpkg/requirements.txt
          npm run check
          python -m unittest tools/mpkg/test_mobile_mpkg.py
          npm run build:windows:installer
          .\build\windows-x64\WallHub\WallHub.exe --smoke-test
          $portableCheck = Join-Path $env:RUNNER_TEMP 'wallhub-portable-check'
          if (Test-Path -LiteralPath $portableCheck) { Remove-Item -LiteralPath $portableCheck -Recurse -Force }
          Expand-Archive -LiteralPath dist/WallHub-Portable-win-x64.zip -DestinationPath $portableCheck
          foreach ($required in @('package.json', 'server.js', 'public/index.html', 'tools/update/apply-update.js')) {
            if (-not (Test-Path -LiteralPath (Join-Path $portableCheck $required))) {
              throw "Portable archive is not rooted at the WallHub application: $required"
            }
          }

      - name: Build cross-platform source update package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          npm run build:ui
          $sourceCheck = Join-Path $env:RUNNER_TEMP 'wallhub-source-check'
          if (Test-Path -LiteralPath $sourceCheck) { Remove-Item -LiteralPath $sourceCheck -Recurse -Force }
          $sourceBase = Join-Path $env:RUNNER_TEMP 'wallhub-source-base.zip'
          git archive --format=zip --output=$sourceBase HEAD
          Expand-Archive -LiteralPath $sourceBase -DestinationPath $sourceCheck
          Remove-Item -LiteralPath (Join-Path $sourceCheck 'public') -Recurse -Force
          Copy-Item -LiteralPath public -Destination (Join-Path $sourceCheck 'public') -Recurse
          foreach ($developmentOnly in @('tools/run-node-tests.js', 'tools/mpkg/test_mobile_mpkg.py')) {
            $developmentPath = Join-Path $sourceCheck $developmentOnly
            if (Test-Path -LiteralPath $developmentPath) { Remove-Item -LiteralPath $developmentPath -Force }
          }
          Get-ChildItem -LiteralPath $sourceCheck -Filter '*.test.js' -Recurse -File | Remove-Item -Force
          Get-ChildItem -LiteralPath $sourceCheck -Filter 'test_*.py' -Recurse -File | Remove-Item -Force
          $remainingTests = @(
            Get-ChildItem -LiteralPath $sourceCheck -Filter '*.test.js' -Recurse -File
            Get-ChildItem -LiteralPath $sourceCheck -Filter 'test_*.py' -Recurse -File
          )
          if ($remainingTests.Count -gt 0) { throw "Source archive still contains test files: $($remainingTests.FullName -join ', ')" }
          $sourcePackagePath = Join-Path $sourceCheck 'package.json'
          $sourcePackage = Get-Content -LiteralPath $sourcePackagePath -Raw | ConvertFrom-Json
          foreach ($script in @('check', 'check:syntax', 'test', 'test:ui')) {
            $sourcePackage.scripts.PSObject.Properties.Remove($script)
          }
          $sourcePackage | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $sourcePackagePath -Encoding UTF8
          foreach ($required in @('package.json', 'package-lock.json', 'server.js', 'public/index.html', 'tools/update/apply-update.js')) {
            if (-not (Test-Path -LiteralPath (Join-Path $sourceCheck $required))) {
              throw "Source archive is missing: $required"
            }
          }
          & node --check (Join-Path $sourceCheck 'server.js')
          Compress-Archive -Path (Join-Path $sourceCheck '*') -DestinationPath dist/WallHub-Source.zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath dist/WallHub-Source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WallHub-Source.zip" | Set-Content -LiteralPath dist/WallHub-Source.zip.sha256 -Encoding ASCII

      - name: Validate authored release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH, received: $env:RELEASE_TAG"
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match package.json version $version"
          }
          $notesPath = Join-Path 'docs/release-notes' "$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Missing required bilingual release notes: $notesPath"
          }
          $notes = Get-Content -LiteralPath $notesPath -Raw
          foreach ($heading in @('## 中文更新', '## English Release Notes', '## 下载说明', '## Downloads')) {
            if (-not $notes.Contains($heading)) {
              throw "Release notes must include the heading: $heading"
            }
          }
          Copy-Item -LiteralPath $notesPath -Destination release-notes.md
          $checksumLines = @(
            '',
            '## SHA-256 校验 / Checksums',
            '',
            ('- `WallHub-Setup-win-x64.exe`: {0}' -f ((Get-Content -LiteralPath 'dist/WallHub-Setup-win-x64.exe.sha256' -Raw).Trim().Split(' ')[0])),
            ('- `WallHub-Portable-win-x64.zip`: {0}' -f ((Get-Content -LiteralPath 'dist/WallHub-Portable-win-x64.zip.sha256' -Raw).Trim().Split(' ')[0])),
            ('- `WallHub-Source.zip`: {0}' -f ((Get-Content -LiteralPath 'dist/WallHub-Source.zip.sha256' -Raw).Trim().Split(' ')[0]))
          )
          Add-Content -LiteralPath release-notes.md -Value ($checksumLines -join [Environment]::NewLine) -Encoding UTF8

      - name: Upload validated release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/WallHub-Portable-win-x64.zip
            dist/WallHub-Setup-win-x64.exe
            dist/WallHub-Source.zip
            release-notes.md

  container:
    name: Publish multi-platform container
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chenleo-7/wallhub
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' || !inputs.prerelease }}

      - name: Resolve release commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and publish amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            WALLHUB_VERSION=${{ inputs.tag || github.ref_name }}
            WALLHUB_REVISION=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the release image is publicly pullable
        shell: bash
        run: |
          docker logout ghcr.io
          if ! docker pull ghcr.io/chenleo-7/wallhub:${{ inputs.tag || github.ref_name }}; then
            echo "::error::The GHCR package is not public. For the first image publish, set the wallhub package visibility to Public in GitHub Packages, then rerun this workflow."
            exit 1
          fi

  publish:
    name: Publish GitHub release
    needs: [artifacts, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          body_path: release-files/release-notes.md
          files: |
            release-files/dist/WallHub-Portable-win-x64.zip
            release-files/dist/WallHub-Setup-win-x64.exe
            release-files/dist/WallHub-Source.zip
          fail_on_unmatched_files: true
